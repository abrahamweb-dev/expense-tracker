<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Expense Tracker</h1>
      <p class="subtitle">Track where your money goes</p>
    </header>

    <section class="summary">
      <div class="total-card">
        <p class="total-label">Total Spent</p>
        <p class="total-amount" id="totalAmount">$0.00</p>
      </div>
    </section>

    <section class="breakdown" id="breakdownSection" style="display: none;">
      <h2>Spending Breakdown</h2>
      <div class="breakdown-content">
        <div class="chart-wrap">
          <canvas id="categoryChart"></canvas>
        </div>
        <div class="legend" id="chartLegend"></div>
      </div>
    </section>

    <section class="add-expense">
      <h2>Add Expense</h2>
      <form id="expenseForm">
        <div class="form-row">
          <input type="number" id="amount" placeholder="Amount" step="0.01" required>
          <select id="category" required>
            <option value="" disabled selected>Category</option>
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚌 Transport</option>
            <option value="Housing">🏠 Housing</option>
            <option value="Entertainment">🎬 Entertainment</option>
            <option value="Health">💊 Health</option>
            <option value="Other">📦 Other</option>
          </select>
        </div>
        <div class="form-row">
          <input type="date" id="expenseDate" required>
          <input type="text" id="note" placeholder="Note (optional)">
        </div>
        <button type="submit" class="btn-add">Add Expense</button>
      </form>
    </section>

    <section class="filters">
      <div class="filter-group">
        <label for="filterCategory">Category</label>
        <select id="filterCategory">
          <option value="all">All</option>
          <option value="Food">🍔 Food</option>
          <option value="Transport">🚌 Transport</option>
          <option value="Housing">🏠 Housing</option>
          <option value="Entertainment">🎬 Entertainment</option>
          <option value="Health">💊 Health</option>
          <option value="Other">📦 Other</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="sortOrder">Sort</label>
        <select id="sortOrder">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="highest">Highest amount</option>
          <option value="lowest">Lowest amount</option>
        </select>
      </div>
    </section>

    <section class="expense-list">
      <h2>Recent Expenses</h2>

      <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <p>Loading your expenses...</p>
      </div>

      <div id="expenseList"></div>

      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon">🧾</div>
        <p>No expenses yet — add your first one above.</p>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="script.js"></script>
</body>
</html>
